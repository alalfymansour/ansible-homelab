---
- name: Install k3s
  hosts: homelab
  become: true

  tasks:
    - name: Download k3s installer
      get_url:
        url: https://get.k3s.io
        dest: /tmp/k3s-install.sh
        mode: '0755'

    - name: Install k3s
      shell: /tmp/k3s-install.sh
      environment:
        INSTALL_K3S_EXEC: "--data-dir=/srv/k3s --disable traefik"
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for k3s to be ready
      wait_for:
        path: /srv/k3s/server/node-token
        timeout: 60

    - name: Enable and start k3s
      systemd:
        name: k3s
        enabled: true
        state: started

    - name: Set kubeconfig permissions
      file:
        path: /etc/rancher/k3s/k3s.yaml
        mode: '0644'

    - name: Copy kubeconfig for alalfy
      shell: |
        mkdir -p /home/alalfy/.kube
        cp /etc/rancher/k3s/k3s.yaml /home/alalfy/.kube/config
        chown alalfy:alalfy /home/alalfy/.kube/config
      args:
        creates: /home/alalfy/.kube/config
